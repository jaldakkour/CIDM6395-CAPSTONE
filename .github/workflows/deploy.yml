name: Deploy to GitHub Pages



on:
  push:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: read # This is usually default, but good practice
  pages: write   # Necessary for deploying to Pages
  id-token: write # CRITICAL: This grants permission for the deploy action


jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write # <-- THIS IS THE CRITICAL LINE

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
